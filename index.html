<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamusia - Chocolatería & Heladería | Armador 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mamusia: {
              50: '#fffcf9',
              100: '#f6ebec',
              200: '#ecd9db',
              300: '#cc4845',
              400: '#e40428',
              500: '#aa0015',
              600: '#880f1d',
              700: '#676465',
              800: '#3d3a3b',
              900: '#1a1919'
            }
          },
          fontFamily: {
            sans: ['"Montserrat"', 'sans-serif'],
          },
          boxShadow: {
            'floating': '0 30px 60px -15px rgba(0, 0, 0, 0.4)',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f8f5f2; }
    
    /* El truco mágico: blend mode para quitar fondo blanco a los bombones y que se fundan con la sombra de la caja */
    .choco-blend { 
        mix-blend-mode: multiply; 
        filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.3));
    }
    
    /* La cuadrícula interior de la caja. Ajustado a ojo para encajar en la imagen 5x5 */
    .box-grid { 
        display: grid; 
        grid-template-columns: repeat(5, 1fr); 
        grid-template-rows: repeat(5, 1fr);
        position: absolute; 
        top: 23%; left: 21%; width: 58%; height: 58%;
        gap: 2%;
    }
    
    .choco-slot {
        width: 100%; height: 100%;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.2s, background-color 0.2s;
        cursor: pointer;
    }
    .choco-slot:hover {
        transform: scale(1.1);
    }
    
    .drag-over {
        transform: scale(1.02);
        filter: brightness(1.1);
    }

    /* Animación de volar */
    @keyframes flyToBox {
        0% { transform: scale(1) translate(0, 0); opacity: 1; }
        100% { transform: scale(0.3) translate(var(--fly-x), var(--fly-y)); opacity: 0; }
    }
    .flying-choco {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        animation: flyToBox 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    
    /* Animación pop in en la caja */
    @keyframes popIn {
        0% { transform: scale(0); }
        80% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
    .pop-in {
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="text-mamusia-800 antialiased min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-mamusia-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 bg-mamusia-400 text-white flex items-center justify-center font-black rounded-lg text-xl">M</div>
        <div>
          <h1 class="font-extrabold text-mamusia-900 leading-none">MAMUSIA</h1>
          <p class="text-[10px] font-bold text-mamusia-400 uppercase tracking-wider">Armador 3D</p>
        </div>
      </div>
      <button onclick="resetBox()" class="text-sm font-bold text-mamusia-400 hover:bg-mamusia-50 px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
        <i data-lucide="trash-2" class="w-4 h-4"></i> Vaciar
      </button>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto w-full p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12">
    
    <!-- LEFT PANEL: The 3D Box -->
    <div class="lg:col-span-7 flex flex-col items-center justify-start pt-4 lg:pt-10">
      
      <div id="box-dropzone" class="relative w-full max-w-md lg:max-w-lg aspect-square transition-all duration-300 rounded-lg">
        <img src="assets/box_empty_1787079906796.png" class="w-full h-full object-cover rounded shadow-floating select-none pointer-events-none" alt="Caja Vacía" />
        
        <!-- Grid overlay -->
        <div id="box-slots-container" class="box-grid">
           <!-- Slots will be injected here -->
        </div>
      </div>
      
      <p class="text-center text-sm font-bold text-gray-400 mt-8 hidden lg:block">
        <i data-lucide="mouse-pointer-click" class="inline w-4 h-4 mr-1"></i> Arrastrá los bombones hacia la caja, o haz clic en ellos para quitarlos.
      </p>

    </div>

    <!-- RIGHT PANEL: Tray & Controls -->
    <div class="lg:col-span-5 flex flex-col h-full">
      
      <div class="bg-white rounded-3xl p-6 shadow-xl border border-mamusia-100 flex flex-col flex-grow">
        
        <!-- Box Size Selection (Gram Logic) -->
        <div class="mb-6">
            <h2 class="text-sm font-black text-mamusia-900 uppercase tracking-widest mb-3">Tamaño de Caja</h2>
            <div class="flex gap-2" id="box-size-container">
                <!-- Sizes injected via JS -->
            </div>
        </div>

        <!-- Capacity Tracker -->
        <div class="py-4 border-t border-b border-gray-100 mb-6">
          <div class="flex justify-between text-sm font-bold mb-2">
            <span class="text-mamusia-700">Capacidad</span>
            <span class="text-mamusia-900" id="capacity-text">0g / 250g</span>
          </div>
          <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden shadow-inner relative">
            <div id="progress-bar" class="h-full bg-mamusia-400 transition-all duration-500 ease-out rounded-full" style="width: 0%"></div>
          </div>
        </div>

        <!-- Draggable Chocolates Tray -->
        <div class="flex-grow">
          <h2 class="text-sm font-black text-mamusia-900 uppercase tracking-widest mb-4">Selección (Arrastrar)</h2>
          <div class="grid grid-cols-2 gap-4" id="chocolates-tray">
             <!-- Chocolates injected via JS -->
          </div>
        </div>

        <!-- Checkout Button -->
        <div class="mt-8 pt-4">
            <div class="flex justify-between items-end mb-4">
              <span class="text-sm font-bold text-mamusia-700">Total Estimado</span>
              <span class="text-2xl font-black text-mamusia-900" id="total-price">$0</span>
            </div>
            <button id="btn-complete-order" disabled class="w-full bg-gray-100 text-gray-400 font-bold py-4 px-4 rounded-xl transition-all flex items-center justify-center gap-2 cursor-not-allowed">
              <span>Agrega más bombones</span>
            </button>
        </div>

      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Javascript Logic -->
  <script>
    // --- Data Models ---
    const BOX_SIZES = [
      { id: 'clasica', name: 'Clásica', weightGrams: 250, price: 18500, isDefault: true },
      { id: 'especial', name: 'Especial', weightGrams: 500, price: 34000 }
    ];

    const CHOCOLATES = [
      { id: 'c_dulce', name: 'Dulce de Leche', weight: 20, img: 'assets/choco_dulce_1787079916067.png' },
      { id: 'c_nuez', name: 'Medallón Nuez', weight: 28, img: 'assets/choco_nuez_1787079928791.png' },
      { id: 'c_blanco', name: 'Blanco Praliné', weight: 20, img: 'assets/choco_blanco_1787079956381.png' },
      { id: 'c_frambuesa', name: 'Frambuesa', weight: 18, img: 'assets/choco_frambuesa_1787079984612.png' }
    ];

    const TOLERANCE_UNDER = 15;
    const TOLERANCE_OVER = 15;
    const MAX_SLOTS = 25; // 5x5 grid

    // --- State ---
    let currentBox = BOX_SIZES.find(b => b.isDefault);
    let boxContents = []; // Array of chocolate IDs inside the box, maintaining order

    // --- Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      renderBoxSizes();
      renderTray();
      renderBoxSlots();
      updateState();
      lucide.createIcons();
      setupDropzone();
    });

    // --- Renders ---
    function renderBoxSizes() {
      const container = document.getElementById('box-size-container');
      container.innerHTML = BOX_SIZES.map(box => {
        const isSelected = currentBox.id === box.id;
        return `
          <button onclick="selectBox('${box.id}')" class="flex-1 py-2 px-3 rounded-lg border-2 font-bold text-sm transition-all ${isSelected ? 'border-mamusia-400 bg-mamusia-50 text-mamusia-900' : 'border-gray-100 text-gray-500 hover:border-mamusia-200'}">
             ${box.name} (${box.weightGrams}g)
          </button>
        `;
      }).join('');
    }

    function renderTray() {
      const container = document.getElementById('chocolates-tray');
      container.innerHTML = CHOCOLATES.map(c => `
        <div draggable="true" ondragstart="handleDragStart(event, '${c.id}')" onclick="handleTrayClick(event, '${c.id}')" class="bg-gray-50 rounded-xl p-3 flex flex-col items-center justify-center cursor-grab hover:bg-mamusia-50 transition-colors border border-transparent hover:border-mamusia-100 active:cursor-grabbing group">
           <img src="${c.img}" class="w-16 h-16 object-contain choco-blend group-hover:scale-110 transition-transform pointer-events-none" />
           <div class="text-xs font-bold text-mamusia-900 mt-2 text-center leading-tight">${c.name}</div>
           <div class="text-[10px] font-bold text-mamusia-400 bg-white px-1.5 py-0.5 rounded shadow-sm mt-1">${c.weight}g</div>
        </div>
      `).join('');
    }

    function renderBoxSlots() {
      const container = document.getElementById('box-slots-container');
      let html = '';
      for (let i = 0; i < MAX_SLOTS; i++) {
        if (i < boxContents.length) {
            const chocoId = boxContents[i];
            const choco = CHOCOLATES.find(c => c.id === chocoId);
            html += `
              <div class="choco-slot pop-in" onclick="removeChoco(${i})" title="Quitar ${choco.name}">
                <img src="${choco.img}" class="w-full h-full object-contain choco-blend" />
              </div>
            `;
        } else {
            // Empty slot
            html += `<div class="choco-slot"></div>`;
        }
      }
      container.innerHTML = html;
    }

    // --- Logic ---
    function selectBox(id) {
       currentBox = BOX_SIZES.find(b => b.id === id);
       
       // Re-verify weight
       const totalWeight = getTotalWeight();
       if (totalWeight > currentBox.weightGrams + TOLERANCE_OVER) {
           showToast('La caja actual pesa más que el nuevo tamaño. Vaciando exceso...', 'error');
           while (getTotalWeight() > currentBox.weightGrams + TOLERANCE_OVER) {
               boxContents.pop();
           }
           renderBoxSlots();
       }
       renderBoxSizes();
       updateState();
    }

    function getTotalWeight() {
      return boxContents.reduce((total, id) => {
        const c = CHOCOLATES.find(x => x.id === id);
        return total + c.weight;
      }, 0);
    }

    function canAddChoco(chocoId) {
      if (boxContents.length >= MAX_SLOTS) {
          showToast('No hay más espacio físico en la caja.', 'error');
          return false;
      }
      const choco = CHOCOLATES.find(c => c.id === chocoId);
      const current = getTotalWeight();
      if (current >= currentBox.weightGrams) {
          showToast('¡Caja llena por peso!', 'error');
          return false;
      }
      if (current + choco.weight > currentBox.weightGrams + TOLERANCE_OVER) {
          showToast('Este bombón excede el límite de peso.', 'error');
          return false;
      }
      return true;
    }

    function addChoco(chocoId) {
       if(canAddChoco(chocoId)) {
           boxContents.push(chocoId);
           renderBoxSlots();
           updateState();
           return true;
       }
       return false;
    }

    function removeChoco(index) {
       boxContents.splice(index, 1);
       renderBoxSlots();
       updateState();
    }

    function resetBox() {
        boxContents = [];
        renderBoxSlots();
        updateState();
        showToast('Caja vaciada');
    }

    function updateState() {
      const totalWeight = getTotalWeight();
      const pct = Math.min(100, Math.round((totalWeight / currentBox.weightGrams) * 100));

      document.getElementById('capacity-text').innerText = `${totalWeight}g / ${currentBox.weightGrams}g`;
      
      const bar = document.getElementById('progress-bar');
      bar.style.width = `${pct}%`;
      
      const isFullEnough = totalWeight >= (currentBox.weightGrams - TOLERANCE_UNDER);
      
      if(isFullEnough) {
        bar.classList.add('bg-[#25D366]');
        bar.classList.remove('bg-mamusia-400');
      } else {
        bar.classList.add('bg-mamusia-400');
        bar.classList.remove('bg-[#25D366]');
      }

      document.getElementById('total-price').innerText = `$${currentBox.price.toLocaleString('es-AR')}`;

      const btn = document.getElementById('btn-complete-order');
      if (isFullEnough) {
        btn.disabled = false;
        btn.className = "w-full bg-mamusia-400 text-white font-bold py-4 px-4 rounded-xl text-sm shadow-lg shadow-mamusia-400/30 flex items-center justify-center gap-2 cursor-pointer hover:bg-mamusia-500 hover:-translate-y-1 transform transition-all";
        btn.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> <span>Finalizar y Pedir</span>`;
      } else {
        btn.disabled = true;
        btn.className = "w-full bg-gray-100 text-gray-400 cursor-not-allowed font-bold py-4 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-2";
        btn.innerHTML = `<span>Faltan aprox. ${currentBox.weightGrams - totalWeight}g</span>`;
      }
      lucide.createIcons();
    }

    // --- Drag & Drop (Desktop) ---
    function handleDragStart(e, chocoId) {
       e.dataTransfer.setData('text/plain', chocoId);
       e.dataTransfer.effectAllowed = 'copy';
       
       // Visual feedback on drag
       const img = new Image();
       const choco = CHOCOLATES.find(c => c.id === chocoId);
       img.src = choco.img;
       e.dataTransfer.setDragImage(img, 30, 30);
    }

    function setupDropzone() {
        const dropzone = document.getElementById('box-dropzone');
        
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            dropzone.classList.add('drag-over');
        });
        
        dropzone.addEventListener('dragleave', (e) => {
            dropzone.classList.remove('drag-over');
        });
        
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            const chocoId = e.dataTransfer.getData('text/plain');
            if(chocoId) addChoco(chocoId);
        });
    }

    // --- Click-to-Fly (Mobile/Alternative) ---
    function handleTrayClick(e, chocoId) {
        // Find center of box
        const boxEl = document.getElementById('box-dropzone');
        const boxRect = boxEl.getBoundingClientRect();
        
        // Find click origin
        const originRect = e.currentTarget.getBoundingClientRect();
        
        if (canAddChoco(chocoId)) {
            // Create flying clone
            const clone = document.createElement('img');
            const choco = CHOCOLATES.find(c => c.id === chocoId);
            clone.src = choco.img;
            clone.className = 'w-16 h-16 object-contain choco-blend flying-choco';
            clone.style.left = `${originRect.left}px`;
            clone.style.top = `${originRect.top}px`;
            
            // Calc distance to center of box
            const targetX = boxRect.left + (boxRect.width / 2) - originRect.left - 32;
            const targetY = boxRect.top + (boxRect.height / 2) - originRect.top - 32;
            
            clone.style.setProperty('--fly-x', `${targetX}px`);
            clone.style.setProperty('--fly-y', `${targetY}px`);
            
            document.body.appendChild(clone);
            
            // Add after animation
            setTimeout(() => {
                clone.remove();
                addChoco(chocoId);
            }, 600);
        }
    }

    // --- Toasts ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const isSuccess = type === 'success';
      const bgColor = isSuccess ? 'bg-white' : 'bg-mamusia-500';
      const textColor = isSuccess ? 'text-mamusia-900' : 'text-white';
      const borderColor = isSuccess ? 'border-l-4 border-mamusia-400' : '';
      const iconUrl = isSuccess ? 'check-circle' : 'alert-circle';
      const iconColor = isSuccess ? 'text-mamusia-400' : 'text-white';

      toast.className = `transform transition-all duration-300 translate-y-10 opacity-0 ${bgColor} ${borderColor} shadow-floating rounded-xl px-4 py-3 text-sm font-bold ${textColor} flex items-center gap-3 pointer-events-auto`;
      toast.innerHTML = `<i data-lucide="${iconUrl}" class="w-5 h-5 ${iconColor}"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      lucide.createIcons();
      
      requestAnimationFrame(() => {
        setTimeout(() => {
          toast.classList.remove('translate-y-10', 'opacity-0');
          toast.classList.add('translate-y-0', 'opacity-100');
        }, 10);
      });
      
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-10', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
  </script>
</body>
</html>
